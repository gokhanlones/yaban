<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Import</title>
</head>
<body style="background:#1B4332;color:white;font-family:sans-serif;padding:24px;">

  <h2>Firestore Import</h2>
  <button id="btn" style="padding:12px 24px;background:#52B788;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">
    Türleri Yükle
  </button>
  <div id="log" style="margin-top:20px;font-size:13px;line-height:2;"></div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMT-mHr3Debz426EdH4s1QOmtcbcMLRzk",
      authDomain: "yaban-b00bd.firebaseapp.com",
      projectId: "yaban-b00bd",
      storageBucket: "yaban-b00bd.firebasestorage.app",
      messagingSenderId: "919377752116",
      appId: "1:919377752116:web:67f545c67931892ebf5a61"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const log = document.getElementById('log');

    async function importData() {
      document.getElementById('btn').disabled = true;
      log.innerHTML = 'Yükleniyor...';

      try {
        const res  = await fetch('species-data.json');
        const data = await res.json();

        for (const item of data) {
          await setDoc(doc(db, 'species', item.id), item);
          log.innerHTML += `✅ ${item.name} yüklendi<br>`;
        }

        log.innerHTML += '<br><strong>🎉 Tüm türler yüklendi!</strong>';
      } catch (e) {
        log.innerHTML += `❌ Hata: ${e.message}`;
      }
    }

    document.getElementById('btn').addEventListener('click', importData);
  </script>
</body>
</html>
