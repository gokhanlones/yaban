<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaban — Türler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green-dark:  #1B4332;
      --green-light: #52B788;
      --white:       #FFFFFF;
      --gray:        #6B7280;
      --red:         #DC2626;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--green-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .banner {
      background: var(--green-dark);
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hamburger {
      background: none;
      border: none;
      color: var(--white);
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--white);
      border-radius: 2px;
    }
    .banner-title {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .banner-placeholder { width: 38px; }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .sidebar-overlay.open { display: block; opacity: 1; }
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--green-dark);
      border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 300;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { left: 0; }
    .sidebar-header {
      padding: 56px 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-header .logo { font-size: 22px; font-weight: 900; letter-spacing: 4px; }
    .sidebar-header .tagline { font-size: 11px; color: var(--green-light); letter-spacing: 1px; margin-top: 4px; }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .sidebar-user .name { font-size: 14px; font-weight: 600; }
    .sidebar-user .email { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .sidebar-menu { flex: 1; padding: 12px 0; }
    .sidebar-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s;
      border: none;
      background: none;
      color: var(--white);
      width: 100%;
      text-align: left;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); }
    .sidebar-item.active { color: var(--green-light); font-weight: 700; }
    .sidebar-bottom { padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-item.logout { color: #F87171; }
    .content {
      flex: 1;
      padding: 16px;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray);
    }
    .species-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 5px 5px 0 0;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
      position: relative;
    }
    .species-card:active { transform: scale(0.99); }
    .species-card img {
      width: 100%;
      aspect-ratio: 2 / 1;
      object-fit: cover;
      border-radius: 5px 5px 0 0;
      display: block;
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-free { background: var(--green-light); color: var(--green-dark); }
    .badge-protected { background: var(--red); color: var(--white); }
    .card-info {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-left .name { font-size: 15px; font-weight: 700; }
    .card-left .season { font-size: 12px; color: var(--green-light); margin-top: 2px; }
    .card-left .protected-text { font-size: 12px; color: var(--red); margin-top: 2px; }
    .card-right .limit { font-size: 13px; font-weight: 700; color: var(--green-light); text-align: right; }
    .card-right .limit-label { font-size: 10px; color: var(--gray); text-align: right; }
    .bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--green-dark);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 100;
    }
    .bottom-btn {
      background: none;
      border: none;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 8px;
    }
    .bottom-btn svg { width: 26px; height: 26px; }
    .profile-btn img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--green-light);
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">YABAN</div>
      <div class="tagline">AVCI'NIN REHBERİ</div>
    </div>
    <div class="sidebar-user">
      <img id="user-photo" src="" alt="" />
      <div>
        <div class="name" id="user-name">...</div>
        <div class="email" id="user-email">...</div>
      </div>
    </div>
    <div class="sidebar-menu">
      <button class="sidebar-item" onclick="window.location.href='avlaklar.html'">Avlaklar</button>
      <button class="sidebar-item active">Türler</button>
      <button class="sidebar-item">Ayarlar</button>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-item logout" id="logout-btn">Çıkış Yap</button>
    </div>
  </div>

  <div class="banner">
    <button class="hamburger" onclick="openSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div class="banner-title">YABAN</div>
    <div class="banner-placeholder"></div>
  </div>

  <div class="content" id="content">
    <div class="loading">Yükleniyor...</div>
  </div>

  <div class="bottombar">
    <button class="bottom-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14 C4 14 5 10 12 10 C19 10 20 14 20 14"/>
        <path d="M3 14 Q12 18 21 14"/>
        <path d="M9 10 C9 10 10 6 12 6 C14 6 15 10 15 10"/>
        <line x1="3" y1="14" x2="2" y2="17"/>
        <line x1="21" y1="14" x2="22" y2="17"/>
        <path d="M2 17 Q12 21 22 17"/>
      </svg>
    </button>
    <button class="bottom-btn" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button class="bottom-btn profile-btn" onclick="window.location.href='profile.html'">
      <img id="bottom-photo" src="" alt="" />
    </button>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMT-mHr3Debz426EdH4s1QOmtcbcMLRzk",
      authDomain: "yaban-b00bd.firebaseapp.com",
      projectId: "yaban-b00bd",
      storageBucket: "yaban-b00bd.firebasestorage.app",
      messagingSenderId: "919377752116",
      appId: "1:919377752116:web:67f545c67931892ebf5a61"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('user-name').textContent  = user.displayName;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-photo').src         = user.photoURL;
      document.getElementById('bottom-photo').src       = user.photoURL;
      await loadSpecies();
    });

    async function loadSpecies() {
      const content = document.getElementById('content');
      try {
        const q = query(collection(db, 'species'), orderBy('order'));
        const snap = await getDocs(q);
        content.innerHTML = '';

        snap.forEach(doc => {
          const s = doc.data();
          const card = document.createElement('div');
          card.className = 'species-card';
          card.innerHTML = `
            <img src="${s.image}" alt="${s.name}" />
            <span class="badge ${s.status === 'free' ? 'badge-free' : 'badge-protected'}">
              ${s.status === 'free' ? 'SERBEST' : 'KORUMA ALTINDA'}
            </span>
            <div class="card-info">
              <div class="card-left">
                <div class="name">${s.name}</div>
                ${s.status === 'free'
                  ? `<div class="season">${s.seasonStart} — ${s.seasonEnd}</div>`
                  : `<div class="protected-text">Avlanması yasaktır</div>`
                }
              </div>
              ${s.status === 'free' ? `
              <div class="card-right">
                <div class="limit">${s.dailyLimit}</div>
                <div class="limit-label">günlük limit</div>
              </div>` : ''}
            </div>
          `;
          content.appendChild(card);
        });

      } catch(e) {
        content.innerHTML = `<div class="loading">Hata: ${e.message}</div>`;
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });

    window.openSidebar = () => {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    };
    window.closeSidebar = () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    };
  </script>
</body>
</html>
